name: Independent thesis Paper2 archive inspection
on:
  push:
    branches: [thesis-deep-audit-20261122]
    paths: ['.github/workflows/thesis_chain_kbs_archive.yml']
  workflow_dispatch:
jobs:
  inspect-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify public frozen Paper2 evidence archive
        run: |
          curl --fail --location --retry 3 --max-time 300 --output /tmp/KBS_Reproduction.zip https://github.com/zhurunze44-hash/PAIR-IS-R9-reproducibility/releases/download/kbs-2026-11-19-reproduction/KBS_Reproduction.zip
          echo '1881b092ef78bd6ef8b05883f0cf6857309f5e12fead826b1418aaee44719535  /tmp/KBS_Reproduction.zip' | sha256sum --check
          python - <<'PY'
          import json,zipfile
          p='/tmp/KBS_Reproduction.zip'
          with zipfile.ZipFile(p) as z:
              names=[x.filename for x in z.infolist() if not x.is_dir()]
              totals=sum(x.file_size for x in z.infolist() if not x.is_dir())
              print('ARCHIVE_FILE_COUNT',len(names))
              print('UNCOMPRESSED_BYTES',totals)
              print('FIRST_35_FILENAMES',json.dumps(names[:35]))
              print('MATCHING_READMES',json.dumps([n for n in names if n.lower().endswith(('readme.md','readme.txt'))][:30]))
              print('MATCHING_RUNNERS',json.dumps([n for n in names if any(q in n.lower() for q in ('verify','replay','run_all','bootstrap')) and n.endswith(('.sh','.py'))][:45]))
          PY
      - name: Inspect public archived 26-stage runner without executing it
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/KBS_Reproduction.zip') as z:
              for name in ('README.txt','RUN_PUBLIC_EVIDENCE.sh'):
                  print('\n---',name,'---')
                  lines=z.read(name).decode('utf-8').splitlines()
                  print('\n'.join(lines[:210]))
          PY
      - name: Check published scientific source manifest bytes
        run: |
          python - <<'PY'
          import zipfile,json,hashlib
          z=zipfile.ZipFile('/tmp/KBS_Reproduction.zip')
          m=json.load(open('evidence/KBS_20261119_SCIENTIFIC_RELEASE_MANIFEST.json'))['files']
          names=set(z.namelist()); matched=0; missing=[];wrong=[];ambiguous=[]
          for path,expected in m.items():
              c=[path] if path in names else [n for n in names if n.endswith('/'+path)]
              if len(c)==0:missing.append(path);continue
              if len(c)>1:ambiguous.append(path);continue
              matched+=1
              if hashlib.sha256(z.read(c[0])).hexdigest()!=expected:wrong.append(path)
          print('MANIFEST_FILES',len(m),'MATCHED',matched,'MISSING',len(missing),'MISMATCH',len(wrong),'AMBIGUOUS',len(ambiguous))
          print('MISSING_SAMPLE',missing[:15]);print('WRONG_SAMPLE',wrong[:10]);print('AMBIGUOUS_SAMPLE',ambiguous[:10])
          if wrong or ambiguous:raise SystemExit(1)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh extract and independently execute all Paper2 archived verification stages
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('/tmp/KBS_Reproduction.zip')
          for name in z.namelist():
              p=pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('unsafe path: '+name)
          z.extractall('/tmp/thesis_kbs_replay')
          PY
          python -m pip install -r /tmp/thesis_kbs_replay/requirements.txt
          set +e
          bash /tmp/thesis_kbs_replay/RUN_PUBLIC_EVIDENCE.sh "$GITHUB_WORKSPACE/kbs_fresh_result" > "$GITHUB_WORKSPACE/kbs_fresh_result.log" 2>&1
          rc=$?
          set -e
          tail -n 100 "$GITHUB_WORKSPACE/kbs_fresh_result.log"
          test "$rc" -eq 0
      - name: Enumerate fresh Paper2 stage receipts, never copy archived historical PASS
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('kbs_fresh_result')
          files=[str(p) for p in root.rglob('*') if p.is_file()] if root.is_dir() else []
          print('INDEPENDENT_REPLAY_OUTPUT_FILES',len(files))
          print('OUTPUT_EXAMPLES',files[:35])
          candidates=[p for p in files if p.lower().endswith(('.json','.txt'))]
          for p in candidates[:20]:
              print('RESULT_FILE',p, 'bytes',pathlib.Path(p).stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-fresh-replay-log-and-receipts
          path: |
            kbs_fresh_result.log
            kbs_fresh_result/**/*.json
